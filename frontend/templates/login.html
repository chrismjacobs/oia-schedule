{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="pad" style="margin-top:20px;">
  <div class="panel" id="login-app" v-cloak style="margin:0;">
    <h2>Log in <span class="hint">登入</span></h2>
    <form v-on:submit.prevent="submit">
      <div class="field">
        <label>Username 帳號</label>
        <input type="text" v-model="username" required autofocus
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" v-model="password" required autocomplete="current-password">
      </div>
      <p class="error-text" v-if="error">[[ error ]]</p>
      <button type="submit" v-bind:disabled="busy">Log in</button>
    </form>
    <!-- Students are added by the office, not by registering themselves.
         The /register routes still work so an invite already sent can be
         accepted, but nothing points at them any more. -->
    <p class="hint" style="margin-top:14px;">No account? Ask the office to set one up for you.</p>
  </div>
</section>
{% endblock %}
{% block page_script %}
<script>
const { createApp } = Vue;
const app = createApp({
  delimiters: ['[[', ']]'],
  data() {
    return { username: "", password: "", error: "", busy: false };
  },
  methods: {
    async submit() {
      this.error = "";
      this.busy = true;
      try {
        await OIA.api.post("/api/auth/login", { username: this.username, password: this.password });
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get("next") || "/";
      } catch (e) {
        this.error = "Login failed — check username/password. 登入失敗";
      } finally {
        this.busy = false;
      }
    },
  },
});
OIA.registerGlobals(app);
app.mount("#login-app");
</script>
{% endblock %}

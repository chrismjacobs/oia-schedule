{% extends "base.html" %}
{% block title %}Leave{% endblock %}
{% block content %}
<div id="leave-app" v-cloak>
  <section class="pad" style="margin-top:10px;">
    <h2>Leave <span class="hint">請假</span></h2>

    <template v-if="isStudent">
      <div class="panel">
        <h3>Request leave 申請請假</h3>
        <form v-on:submit.prevent="submitRequest">
          <div class="field">
            <label>Slot</label>
            <select v-model="slotId" required>
              <option v-for="a in mySlots" v-bind:key="a.slot.id" v-bind:value="a.slot.id">[[ a.slot.date ]] [[ a.slot.hour ]]:00</option>
            </select>
          </div>
          <div class="field"><label>Reason</label><textarea v-model="reason" required rows="2"></textarea></div>
          <button v-bind:disabled="busy" type="submit">Submit</button>
        </form>
        <p class="hint">[[ message ]]</p>
        <p class="hint">Once approved you're off that shift. The hour usually opens up on
          <a href="/open-shifts">Open Shifts</a> for someone else to claim.</p>
      </div>

      <div class="panel">
        <h3>My requests</h3>
        <table class="data">
          <thead><tr><th>Slot</th><th>Status</th></tr></thead>
          <tbody>
            <tr v-for="r in myRequests" v-bind:key="r.id">
              <td class="mono">#[[ r.slot_id ]]</td>
              <td><span class="badge" v-bind:class="{ ok: r.status==='approved', warn: r.status==='denied' }">[[ r.status ]]</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </template>

    <template v-if="isOverseer">
      <div class="panel">
        <h3>Pending requests</h3>
        <p class="hint" v-if="!adminRequests.length">None</p>
        <table class="data" v-else>
          <thead><tr><th>Student</th><th>Slot</th><th>Reason</th><th>Lead (h)</th><th>Advertise</th><th></th></tr></thead>
          <tbody>
            <tr v-for="r in adminRequests" v-bind:key="r.id">
              <td>[[ r.student.english_name || r.student.chinese_name ]]</td>
              <td class="mono">[[ r.slot.date ]] [[ r.slot.hour ]]:00</td>
              <td>[[ r.reason ]]</td>
              <td class="mono">[[ r.lead_time_hours ]]</td>
              <td>
                <label class="inline-check" v-bind:for="'adv-' + r.id">
                  <input type="checkbox" v-bind:id="'adv-' + r.id" v-model="advertiseOnApprove[r.id]">
                  <span>Open it up</span>
                </label>
              </td>
              <td><button v-bind:disabled="busy" v-on:click="approve(r)">Approve</button></td>
            </tr>
          </tbody>
        </table>
        <p class="hint">There's no Deny — a student who can't come, can't come. The only choice is whether the freed
          hour goes onto <a href="/open-shifts">Open Shifts</a> for someone else to claim. Leave "Open it up" ticked
          for that (the usual case); untick it to release the student but keep the hour off the board — you can still
          advertise it later from the 📢 icon on the Schedule grid.</p>
        <p class="error-text" v-if="adminMessage">[[ adminMessage ]]</p>
      </div>
    </template>
  </section>
</div>
{% endblock %}
{% block page_script %}
<script>
const { createApp } = Vue;
const app = createApp({
  delimiters: ['[[', ']]'],
  data() {
    return {
      isStudent: CURRENT_USER && CURRENT_USER.role === "student",
      isOverseer: CURRENT_USER && CURRENT_USER.role === "overseer",
      mySlots: [], myRequests: [], adminRequests: [],
      // Per-request "put the freed hour on Open Shifts" choice, keyed by
      // request id. Ticked by default — that's the common case; the overseer
      // unticks the exceptions.
      advertiseOnApprove: {},
      slotId: "", reason: "", busy: false, message: "", adminMessage: "",
    };
  },
  async mounted() {
    if (this.isStudent) await this.loadStudent();
    if (this.isOverseer) await this.loadAdmin();
  },
  methods: {
    async loadStudent() {
      const [assignments, requests] = await Promise.all([
        OIA.api.get("/api/schedule/mine"),
        OIA.api.get("/api/leave"),
      ]);
      const today = new Date().toISOString().slice(0, 10);
      this.mySlots = assignments.filter(a => a.slot.date >= today);
      this.myRequests = requests;
    },
    async loadAdmin() {
      this.adminRequests = await OIA.api.get("/api/leave/admin?status=pending");
      const choices = {};
      this.adminRequests.forEach(r => {
        choices[r.id] = this.advertiseOnApprove[r.id] !== undefined ? this.advertiseOnApprove[r.id] : true;
      });
      this.advertiseOnApprove = choices;
    },
    async submitRequest() {
      this.busy = true; this.message = "";
      try {
        await OIA.api.post("/api/leave", { slot_id: Number(this.slotId), reason: this.reason });
        this.reason = ""; this.slotId = "";
        await this.loadStudent();
        this.message = "Request submitted.";
      } catch (e) {
        this.message = e.message;
      } finally { this.busy = false; }
    },
    async approve(r) {
      this.busy = true; this.adminMessage = "";
      try {
        await OIA.api.patch("/api/leave/admin/" + r.id, {
          status: "approved",
          advertise: this.advertiseOnApprove[r.id] !== false,
        });
        await this.loadAdmin();
      } catch (e) {
        this.adminMessage = e.message;
      } finally { this.busy = false; }
    },
  },
});
OIA.registerGlobals(app);
app.mount("#leave-app");
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Draft review{% endblock %}
{% block content %}
<div id="draft-app" v-cloak>
  <section class="pad" style="margin-top:10px;">
    <div class="field-row" style="align-items:end;">
      <div class="field" style="max-width:260px;">
        <label>Month 月份</label>
        <select v-model.number="monthId">
          <option v-for="m in months" v-bind:key="m.id" v-bind:value="m.id">[[ m.year_month ]] ([[ m.state ]])</option>
        </select>
      </div>
      <button v-bind:disabled="busy" v-on:click="generateDraft">Generate draft 產生草案</button>
      <button v-bind:disabled="busy || !payload || (payload.schedule && payload.schedule.status === 'committed')" v-on:click="commit">Commit 確認排班</button>
    </div>
    <p class="hint">[[ message ]]</p>
  </section>

  <section class="pad" v-if="payload">
    <template v-for="(week, wi) in weeks" v-bind:key="wi">
      <div class="weeklabel">Week [[ wi + 1 ]] <span class="hint">[[ week[0].slice(5) ]] – [[ week[week.length - 1].slice(5) ]]</span></div>
      <div class="weekwrap">
        <table class="grid">
          <thead>
            <tr>
              <th class="h">時 / hr</th>
              <th v-for="d in week" v-bind:key="d">[[ weekdayLabel(d) ]]<br>[[ d.slice(5) ]]</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="h in HOURS" v-bind:key="h">
              <td class="h mono">[[ hourLabel(h) ]]</td>
              <td v-for="d in week" v-bind:key="d + '_' + h"
                  class="reg-cell" v-bind:class="cellClass(d, h)"
                  v-bind:style="cellStyle(d, h)">
                <select v-if="row(d, h)"
                        v-bind:value="row(d, h).assignment ? row(d, h).assignment.student_id : ''"
                        v-on:change="changeAssignment(row(d, h), $event.target.value)">
                  <option value="">[[ stateLabel('unassigned') ]]</option>
                  <option v-for="sid in row(d, h).eligible_student_ids" v-bind:key="sid" v-bind:value="sid">[[ studentLabel(sid) ]]</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </template>
    <div class="weeknote">colour = the student currently assigned · empty select = uncovered</div>
  </section>
</div>
{% endblock %}
{% block page_script %}
<script>
const { createApp } = Vue;
const HOURS = [8, 9, 10, 11, 13, 14, 15, 16];
const app = createApp({
  delimiters: ['[[', ']]'],
  data() {
    return { months: [], monthId: null, payload: null, busy: false, message: "", narrow: false, HOURS };
  },
  computed: {
    rowsByKey() {
      const map = {};
      if (this.payload) this.payload.slots.forEach(r => { map[r.slot.date + "_" + r.slot.hour] = r; });
      return map;
    },
    weeks() {
      if (!this.payload) return [];
      const seen = new Set(), dates = [];
      this.payload.slots.forEach(r => { if (!seen.has(r.slot.date)) { seen.add(r.slot.date); dates.push(r.slot.date); } });
      return OIA.groupIntoWeeks(dates);
    },
  },
  watch: { monthId() { this.loadPayload(); } },
  async mounted() {
    OIA.watchNarrow((v) => { this.narrow = v; });
    this.months = await OIA.api.get("/api/admin/months");
    const preferred = this.months.find(m => m.state === "review") || this.months[0];
    if (preferred) this.monthId = preferred.id;
  },
  methods: {
    weekdayLabel(d) { return OIA.weekdayLabel(d); },
    hourLabel(h) { return OIA.hourLabel(h, this.narrow); },
    stateLabel(state) { return OIA.stateLabel(state, this.narrow); },
    row(d, h) { return this.rowsByKey[d + "_" + h]; },
    cellClass(d, h) {
      const r = this.row(d, h);
      if (!r) return {};
      return { "no-eligible": !r.assignment && !r.eligible_student_ids.length };
    },
    cellStyle(d, h) {
      const r = this.row(d, h);
      if (r && r.assignment) {
        const s = this.payload.students[r.assignment.student_id];
        if (s) return { background: s.colour + "22" };
      }
      return {};
    },
    studentLabel(id) {
      const s = this.payload.students[id];
      const name = s ? (s.english_name || s.chinese_name) : ("#" + id);
      return this.narrow ? OIA.shortName(name) : name;
    },
    async loadPayload() {
      if (!this.monthId) return;
      this.payload = await OIA.api.get("/api/schedule/months/" + this.monthId);
    },
    async generateDraft() {
      this.busy = true; this.message = "";
      try {
        const res = await OIA.api.post("/api/schedule/months/" + this.monthId + "/generate-draft");
        this.message = "Solver: " + res.meta.status + ", assigned " + res.meta.assigned + "/" + res.meta.total_slots;
        this.months = await OIA.api.get("/api/admin/months");
        await this.loadPayload();
      } catch (e) {
        this.message = e.message;
      } finally {
        this.busy = false;
      }
    },
    async changeAssignment(row, newStudentId) {
      if (row.assignment) {
        await OIA.api.patch("/api/schedule/assignments/" + row.assignment.id, { student_id: newStudentId === "" ? null : Number(newStudentId) });
      } else if (newStudentId !== "") {
        await OIA.api.post("/api/schedule/months/" + this.monthId + "/assignments", { slot_id: row.slot.id, student_id: Number(newStudentId) });
      }
      await this.loadPayload();
    },
    async commit() {
      this.busy = true; this.message = "";
      try {
        await OIA.api.post("/api/schedule/months/" + this.monthId + "/commit");
        this.message = "Committed.";
        this.months = await OIA.api.get("/api/admin/months");
      } catch (e) {
        this.message = e.message;
      } finally {
        this.busy = false;
      }
    },
  },
});
OIA.registerGlobals(app);
app.mount("#draft-app");
</script>
{% endblock %}

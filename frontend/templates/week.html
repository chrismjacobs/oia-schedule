{% extends "base.html" %}
{% block title %}Schedule{% endblock %}
{% block content %}
<div id="week-app" v-cloak>
  <section class="pad" style="margin-top:10px;">
    <div class="field" style="max-width:260px;">
      <label>Month 月份</label>
      <select v-model.number="monthId">
        <option v-for="m in months" v-bind:key="m.id" v-bind:value="m.id">[[ m.year_month ]] ([[ m.state ]])</option>
      </select>
    </div>
  </section>

  <section class="pad" v-if="!payload"><p class="hint">Loading…</p></section>

  <template v-else>
    <section class="pad" v-if="!visibleWeeks.length"><p class="hint">This month is over — nothing left to show.</p></section>

    <template v-for="(week, wi) in visibleWeeks" v-bind:key="wi">
      <div class="weeklabel">Week [[ weekNumber(week) ]] <span class="hint">[[ week[0].slice(5) ]] – [[ week[week.length - 1].slice(5) ]]</span></div>
      <div class="weekwrap">
        <table class="grid">
          <thead>
            <tr>
              <th class="h">時 / hr</th>
              <th v-for="d in week" v-bind:key="d">[[ weekdayLabel(d) ]]<br>[[ d.slice(5) ]]</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="h in HOURS" v-bind:key="h">
              <td class="h mono">[[ hourLabel(h) ]]</td>
              <td v-for="d in week" v-bind:key="d + '_' + h"
                  class="reg-cell" v-bind:class="cellClass(d, h)" v-bind:style="cellStyle(d, h)"
                  v-bind:title="cellTitle(d, h)">
                <span class="sched-cell" v-if="row(d, h) && row(d, h).student">
                  <oia-token v-bind:student="row(d, h).student" size="sm"></oia-token>
                  <span class="sched-name">[[ studentLabel(row(d, h).student) ]]</span>
                </span>
                <span class="adv-cell" v-else-if="row(d, h) && row(d, h).advertised">
                  <span class="hint">[[ narrow ? 'adv' : 'advertised' ]]</span>
                  <button class="icon-btn" type="button"
                          v-bind:disabled="busySlot === cellKey(d, h)"
                          v-on:click="retract(row(d, h))"
                          aria-label="Retract this open shift">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                  </button>
                </span>
                <button class="icon-btn adv-btn" type="button" v-else-if="canAdvertise(d)"
                        v-bind:disabled="busySlot === cellKey(d, h)"
                        v-on:click="advertise(d, h)"
                        aria-label="Advertise this hour on Open Shifts">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/>
                    <path d="M16 9.5a3.2 3.2 0 0 1 0 5"/>
                    <path d="M18.8 7a7 7 0 0 1 0 10"/>
                  </svg>
                </button>
                <span class="leave-pin" v-if="row(d, h) && row(d, h).pending_leave"></span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </template>
    <div class="weeknote">colour + shape = one student at a glance · amber ring = leave requested, not yet approved ·
      📢 advertises an empty hour on Open Shifts, ✕ pulls it back · past weeks are hidden</div>
    <p class="error-text pad" v-if="message">[[ message ]]</p>

    <div class="roster">
      <h3>Roster · 名冊</h3>
      <div class="rlist">
        <div class="ritem" v-for="s in Object.values(payload.students)" v-bind:key="s.id">
          <oia-token v-bind:student="s" size="sm"></oia-token>
          <div class="rn">
            <div class="a">[[ s.english_name || s.chinese_name ]]</div>
            <div class="b">[[ s.chinese_name ]]</div>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
{% endblock %}
{% block page_script %}
<script>
const { createApp } = Vue;
const HOURS = [8, 9, 10, 11, 13, 14, 15, 16];
const app = createApp({
  delimiters: ['[[', ']]'],
  data() {
    return { months: [], monthId: null, payload: null, busySlot: null, message: "", narrow: false, HOURS };
  },
  computed: {
    rowsByKey() {
      const map = {};
      if (this.payload) this.payload.slots.forEach(r => { map[r.slot.date + "_" + r.slot.hour] = r; });
      return map;
    },
    weeks() {
      // Built from the month's working calendar, not from the slots that
      // happen to exist: an hour the regular schedule marked unavailable has
      // no Slot behind it, but it still needs a cell so it can be advertised
      // if the need comes up.
      if (!this.payload) return [];
      return OIA.groupIntoWeeks(this.payload.dates || []);
    },
    todayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    },
    visibleWeeks() {
      // A week that has fully ended (its last day is before today) is just
      // noise for the overseer's live view — drop it.
      return this.weeks.filter(week => week[week.length - 1] >= this.todayStr);
    },
  },
  watch: {
    async monthId() {
      if (!this.monthId) return;
      await this.reload();
    },
  },
  async mounted() {
    OIA.watchNarrow((v) => { this.narrow = v; });
    this.months = await OIA.api.get("/api/admin/months");
    if (this.months.length) {
      const preferred = this.months.find(m => m.state === "running") || this.months[0];
      this.monthId = preferred.id;
    }
  },
  methods: {
    async reload() {
      this.payload = await OIA.api.get("/api/dashboard/months/" + this.monthId + "/grid");
    },
    row(date, hour) { return this.rowsByKey[date + "_" + hour]; },
    cellKey(date, hour) { return date + "_" + hour; },
    weekdayLabel(d) { return OIA.weekdayLabel(d); },
    hourLabel(h) { return OIA.hourLabel(h, this.narrow); },
    weekNumber(week) { return this.weeks.indexOf(week) + 1; },
    studentLabel(s) {
      const name = s.english_name || s.chinese_name;
      return this.narrow ? OIA.shortName(name) : name;
    },
    // Advertising a past hour helps nobody — the offer could never be taken up.
    canAdvertise(d) { return d >= this.todayStr; },
    cellClass(d, h) {
      const r = this.row(d, h);
      if (!r) return { "sched-noslot": true };
      const pending = !!r.pending_leave;
      if (r.student) {
        return {
          "sched-flagged": r.status === "flagged",
          "sched-recorded": r.status === "recorded",
          "sched-leave-pending": pending,
        };
      }
      return { "sched-advertised": r.advertised, "sched-uncovered": !r.advertised, "sched-leave-pending": pending };
    },
    cellStyle(d, h) {
      const r = this.row(d, h);
      if (r && r.student && r.status === "scheduled") return { background: r.student.colour + "22" };
      return {};
    },
    cellTitle(d, h) {
      const r = this.row(d, h);
      if (r && r.pending_leave) {
        const who = r.pending_leave.student
          ? (r.pending_leave.student.english_name || r.pending_leave.student.chinese_name)
          : "Someone";
        return who + " requested leave for this hour — pending approval: " + r.pending_leave.reason;
      }
      if (r && r.advertised) return "Open on Open Shifts — click ✕ to retract";
      if (!r) return "No slot generated for this hour — advertising it creates one";
      if (!r.student) return "Uncovered";
      return null;
    },
    async advertise(d, h) {
      const key = this.cellKey(d, h);
      this.busySlot = key;
      this.message = "";
      try {
        const r = this.row(d, h);
        // A cell with no Slot behind it is addressed by (month, date, hour) —
        // the backend creates the Slot on demand.
        await OIA.api.post("/api/leave/advertise", r
          ? { slot_id: r.slot.id }
          : { month_id: this.monthId, date: d, hour: h });
        await this.reload();
      } catch (e) {
        this.message = e.message === "no_committed_schedule"
          ? "This month has no committed schedule yet — commit it before advertising hours."
          : e.message;
      } finally {
        this.busySlot = null;
      }
    },
    async retract(r) {
      this.busySlot = this.cellKey(r.slot.date, r.slot.hour);
      this.message = "";
      try {
        await OIA.api.del("/api/leave/reopened/" + r.reopened_id);
        await this.reload();
      } catch (e) {
        this.message = e.message === "already_claimed"
          ? "Someone already claimed this shift — edit the assignment instead."
          : e.message;
      } finally {
        this.busySlot = null;
      }
    },
  },
});
OIA.registerGlobals(app);
app.mount("#week-app");
</script>
{% endblock %}
